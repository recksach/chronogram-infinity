<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$MASON Elite Pre-Registration</title>
    
    <!-- SDK Телеграма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SDK TonConnect UI (Загружается строго до вашего app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    
    <!-- Ваши стили (Оставьте ваши стили без изменений, ниже пример структуры) -->
    <style>
        body {
            background-color: #0b0c0e;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
        }
        .profile-section {
            display: none; /* Скрыто по умолчанию */
        }
        .profile-section.show {
            display: block; /* Показывается при подключении */
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- Пример вашей разметки -->
    <div class="app-container">
        <h2>$MASON Elite Pre-Registration</h2>
        
        <!-- Кнопка вызова кошелька -->
        <button id="connectWalletBtn" onclick="connectWallet()">Connect Wallet</button>
        
        <!-- Блок профиля, который открывается после успешного коннекта -->
        <div id="profileSection" class="profile-section">
            <p>Ваш адрес: <span id="walletAddrText"></span></p>
        </div>
    </div>

    <!-- Элемент для всплывающих уведомлений -->
    <div id="toast" class="toast"></div>

    <!-- ВАШ ОСНОВНОЙ СКРИПТ: обязательно с атрибутом defer -->
    <script src="app.js" defer></script>
</body>
</html>
